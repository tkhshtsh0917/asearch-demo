version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/integration", "/integration/experiments/ruri"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@types/node"
        versions: [">=25"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
