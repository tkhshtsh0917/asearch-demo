name: Browser embedding probe checks
on:
  pull_request:
    paths:
      - "integration/experiments/ruri/**"
      - ".github/workflows/embedding-probe.yml"
  push:
    branches: [main]
    paths:
      - "integration/experiments/ruri/**"
      - ".github/workflows/embedding-probe.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integration/experiments/ruri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - run: npm install --global pnpm@12.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Check native reference scripts
        run: |
          python3 -m venv "$RUNNER_TEMP/ruri-lint"
          "$RUNNER_TEMP/ruri-lint/bin/pip" install --disable-pip-version-check --no-deps ruff==0.17.3
          "$RUNNER_TEMP/ruri-lint/bin/ruff" check tools
          "$RUNNER_TEMP/ruri-lint/bin/ruff" format --check tools
      - run: pnpm build
      - run: pnpm audit --audit-level low
