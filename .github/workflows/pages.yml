name: Validate and deploy playground
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.0
      - run: npm install --global pnpm@12.14.0
      - run: rustup toolchain install 1.97.0 --profile minimal --target wasm32-unknown-unknown
      - run: cargo +1.97.0 install wasm-bindgen-cli --version 0.2.129 --locked
      # Standard-library-only preparation runs before the local tarball dependency exists.
      - run: node tools/engine/build.ts
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm data:prepare
      - run: pnpm build
        env:
          BASE_PATH: /asearch-demo/
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
