name: Validate release assets
on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: latest
      upload_pages:
        type: boolean
        default: false
    outputs:
      tag:
        description: Exact Rust release tag used by the validated build
        value: ${{ jobs.build.outputs.tag }}
permissions:
  contents: read
jobs:
  security:
    uses: ./.github/workflows/security.yml
  build:
    needs: security
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pin.outputs.tag }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - run: npm install --global pnpm@12.14.0
      - run: rustup toolchain install 1.97.0 --profile minimal
      - run: cargo +1.97.0 install wasm-bindgen-cli --version 0.2.129 --locked
      - run: pnpm --dir integration install --frozen-lockfile
      - name: Resolve release identity and checksums
        id: pin
        run: node tools/engine/select.ts "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
      - run: node tools/engine/build.ts
      - run: pnpm install --lockfile-only --update-checksums --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm analysis:prepare
      - run: pnpm analysis:test
      - run: pnpm --dir integration fixtures:check
      - run: pnpm --dir integration docs:check
      - run: pnpm --dir integration test:bench
      - run: pnpm --dir integration typecheck
      - run: pnpm --dir integration lint
      - run: pnpm --dir integration test
      - run: pnpm check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.4
      - run: pnpm --dir integration test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - run: pnpm data:prepare
      - run: pnpm build
        env:
          BASE_PATH: /asearch-demo/
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm --dir integration test:browser
      - run: pnpm test:dev
      - run: pnpm test:e2e
      - run: node tools/engine/provenance.ts
      - run: node tools/ci/pages-artifact.ts create dist pages-files.json
        if: inputs.upload_pages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-inputs
          path: |
            release.lock.json
            pnpm-lock.yaml
            dist/release.json
            dist/data/analysis.json
            tools/analysis/resources.lock.json
            tools/analysis/policy.json
            pages-files.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: inputs.upload_pages
        with:
          path: dist
  artifact-roundtrip:
    if: inputs.upload_pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: .artifact-download/pages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-inputs
          path: .artifact-download/inputs
      - run: bash .github/scripts/verify-pages-artifact.sh
