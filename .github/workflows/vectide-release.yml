name: Verify supplied Vectide release
on:
  workflow_dispatch:
    inputs:
      asset_url:
        description: Public Linux vectide Release Asset URL
        required: true
        type: string
      sha256:
        description: Expected archive SHA-256 from the selected release
        required: true
        type: string
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: integration/vectide
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - run: npm install --global pnpm@12.14.0
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo +1.99.1 install wasm-bindgen-cli --version 0.2.129 --locked
      - run: pnpm check
      - name: Download and verify explicit release
        env:
          ASSET_URL: ${{ inputs.asset_url }}
          ASSET_SHA: ${{ inputs.sha256 }}
        run: node tools/download.ts "$ASSET_URL" "$ASSET_SHA"
      - name: Prepare supplied assets
        env:
          ASSET_SHA: ${{ inputs.sha256 }}
        run: pnpm prepare:assets ".data/releases/$ASSET_SHA/vectide-x86_64-unknown-linux-gnu"
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: |
          for profile in chromium firefox webkit android-profile iphone-profile; do
            pnpm test:browser "$profile" || exit
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: vector-conformance
          path: integration/vectide/results/*.json
          if-no-files-found: error
