name: Vectide consumer checks
on:
  pull_request:
    paths:
      - "integration/vectide/**"
      - "tools/data/corpus.ts"
      - "tools/data/range-file.ts"
      - "tools/security/runtime.ts"
      - ".github/workflows/vectide.yml"
  push:
    branches: [main]
    paths:
      - "integration/vectide/**"
      - "tools/data/corpus.ts"
      - "tools/data/range-file.ts"
      - "tools/security/runtime.ts"
      - ".github/workflows/vectide.yml"
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integration/vectide
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - run: npm install --global pnpm@12.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Check native document encoder without model dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/vector-python"
          "$RUNNER_TEMP/vector-python/bin/pip" install --disable-pip-version-check --no-deps ruff==0.17.3
          "$RUNNER_TEMP/vector-python/bin/ruff" check tools
          "$RUNNER_TEMP/vector-python/bin/ruff" format --check tools
          "$RUNNER_TEMP/vector-python/bin/python" -m unittest discover -s tools -p 'test_*.py'
      - run: pnpm build
      - run: pnpm audit --audit-level low
